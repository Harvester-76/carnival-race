<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта трассы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative; width:280px; height:280px; font-family:'Golos Text',sans-serif; color:#F7E6BF">
  <div style="position:absolute; left:0; top:0; width:280px; height:280px; border-radius:10px; background:rgba(6,10,24,0.72); box-shadow:inset 0 0 0 1px rgba(147,169,217,0.28)"></div>
  <div style="position:absolute; left:12px; top:12px; font-weight:700; font-size:11px; line-height:13px; letter-spacing:0.06em; color:#93A9D9">ТРАССА</div>
  <div style="position:absolute; left:12px; top:28px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; line-height:16px; color:#F7E6BF">{{progT}}</div>
  <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute; left:0; top:0" aria-hidden="true">
    <path d="{{allPath}}" fill="none" stroke="#060A18" stroke-opacity="0.6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></path>
    <path d="{{donePath}}" fill="none" stroke="#93A9D9" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>
    <path d="{{restPath}}" fill="none" stroke="#F7E6BF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>
    <path d="{{cuts}}" fill="none" stroke="#FF8A1E" stroke-width="3" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"></path>
    <path d="{{rivalDots}}" fill="#93A9D9" stroke="#060A18" stroke-width="1.5"></path>
    <path d="{{startMark}}" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path>
    <circle cx="{{fin.x}}" cy="{{fin.y}}" r="6.5" fill="#F24033" stroke="#FFFFFF" stroke-width="2"></circle>
    <path d="{{finFlag}}" fill="#FFFFFF"></path>
    <circle cx="{{me.x}}" cy="{{me.y}}" r="12" fill="#FF8A1E" fill-opacity="0.22"></circle>
    <path d="{{meTri}}" fill="#FF8A1E" stroke="#060A18" stroke-width="2" stroke-linejoin="round"></path>
  </svg>
  <div style="position:absolute; left:{{finLabelX}}px; top:{{finLabelY}}px; font-weight:700; font-size:11px; line-height:13px; letter-spacing:0.06em; color:#F7E6BF">ФИНИШ</div>
  <div style="position:absolute; left:{{startLabelX}}px; top:{{startLabelY}}px; font-weight:700; font-size:11px; line-height:13px; letter-spacing:0.06em; color:#93A9D9">СТАРТ</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.06},"rivals":{"editor":null},"$preview":{"width":280,"height":280}}'>
class Component extends DCLogic {
  renderVals() {
    const prog = Math.max(0, Math.min(1, this.props.progress ?? 0.06));
    const rv = this.props.rivals ?? [0.07, 0.065, 0.058, 0.05];
    const RAW = [[108,309],[102,306],[102,276],[100,273],[100,268],[103,265],[105,258],[110,253],[110,244],[117,238],[128,238],[131,235],[132,230],[139,226],[142,219],[141,205],[153,195],[157,176],[152,166],[152,160],[161,152],[162,149],[157,138],[157,132],[161,128],[168,128],[175,121],[180,121],[180,114],[184,110],[197,111],[200,110],[203,105],[203,81],[195,76],[185,76],[176,81],[168,79],[164,74],[164,68],[160,62],[160,54],[163,50],[187,50],[197,43],[202,36]];
    const CUTS = [[[203,86],[208,73],[199,65],[199,61],[204,50],[198,41]], [[165,130],[181,121]], [[127,236],[134,229],[137,221],[136,206],[148,197],[152,180]]];
    const s = 0.86, T = q => [140 + (q[0] - 153) * s, 22 + (q[1] - 36) * s];
    const pts = RAW.map(T);
    const d = a => a.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const total = cum[cum.length - 1];
    const at = f => {
      const L = f * total; let i = 1;
      while (i < cum.length - 1 && cum[i] < L) i++;
      const t = (L - cum[i - 1]) / Math.max(0.001, cum[i] - cum[i - 1]);
      const a = pts[i - 1], b = pts[i];
      return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, i, dx: b[0] - a[0], dy: b[1] - a[1] };
    };
    const me = at(prog);
    const done = pts.slice(0, me.i).concat([[me.x, me.y]]);
    const rest = [[me.x, me.y]].concat(pts.slice(me.i));
    const len = Math.hypot(me.dx, me.dy) || 1, ux = me.dx / len, uy = me.dy / len;
    const tri = 'M' + (me.x + ux * 9).toFixed(1) + ' ' + (me.y + uy * 9).toFixed(1) + ' L' + (me.x - ux * 6 - uy * 6).toFixed(1) + ' ' + (me.y - uy * 6 + ux * 6).toFixed(1) + ' L' + (me.x - ux * 6 + uy * 6).toFixed(1) + ' ' + (me.y - uy * 6 - ux * 6).toFixed(1) + ' Z';
    const st = pts[0], fin = pts[pts.length - 1];
    const rivalDots = rv.map(f => { const q = at(f); return 'M' + (q.x + 3.5).toFixed(1) + ' ' + q.y.toFixed(1) + ' A3.5 3.5 0 1 0 ' + (q.x + 3.49).toFixed(1) + ' ' + (q.y - 0.25).toFixed(1) + ' Z'; }).join(' ');
    return {
      allPath: d(pts), donePath: d(done), restPath: d(rest), cuts: CUTS.map(c => d(c.map(T))).join(' '),
      rivalDots, me: { x: me.x.toFixed(1), y: me.y.toFixed(1) }, meTri: tri,
      fin: { x: fin[0].toFixed(1), y: fin[1].toFixed(1) },
      finFlag: 'M' + (fin[0] - 2.5).toFixed(1) + ' ' + (fin[1] - 2.5).toFixed(1) + ' h2.5 v2.5 h-2.5 Z M' + fin[0].toFixed(1) + ' ' + fin[1].toFixed(1) + ' h2.5 v2.5 h-2.5 Z',
      startMark: 'M' + (st[0] - 7).toFixed(1) + ' ' + st[1].toFixed(1) + ' H' + (st[0] + 7).toFixed(1),
      finLabelX: (fin[0] + 12).toFixed(0), finLabelY: (fin[1] - 6).toFixed(0),
      startLabelX: (st[0] + 12).toFixed(0), startLabelY: (st[1] - 6).toFixed(0),
      progT: Math.round(prog * 100) + '%'
    };
  }
}
</script>
</body>
</html>
