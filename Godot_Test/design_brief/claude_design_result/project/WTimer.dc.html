<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Время и прогресс</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative; width:360px; height:96px; font-family:'Golos Text',sans-serif; color:#F7E6BF">
  <div style="position:absolute; left:0; top:0; width:360px; height:96px; border-radius:10px; background:rgba(6,10,24,0.72); box-shadow:inset 0 0 0 1px rgba(147,169,217,0.28)"></div>
  <div style="position:absolute; left:0; top:8px; width:360px; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:36px; line-height:42px; color:#F7E6BF">{{time}}</div>
  <svg width="360" height="96" viewBox="0 0 360 96" style="position:absolute; left:0; top:0" aria-hidden="true">
    <rect x="16" y="56" width="328" height="6" rx="3" fill="#93A9D9" fill-opacity="0.2"></rect>
    <rect x="16" y="56" width="{{fillW}}" height="6" rx="3" fill="#FF8A1E"></rect>
    <path d="{{cutMarks}}" stroke="#FF8A1E" stroke-opacity="0.75" stroke-width="2"></path>
    <path d="M98 53 V65 M180 53 V65 M262 53 V65" stroke="#060A18" stroke-opacity="0.7" stroke-width="1"></path>
  </svg>
  <div style="position:absolute; left:16px; right:16px; top:72px; display:flex; align-items:baseline; justify-content:space-between; gap:12px">
    <span style="min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:700; font-size:11px; letter-spacing:0.06em; color:#93A9D9; opacity:{{levelOpacity}}">{{level}}</span>
    <span style="white-space:nowrap"><span style="font-weight:700; font-size:11px; letter-spacing:0.06em; color:#93A9D9">ДО ФИНИША </span><span style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:#F7E6BF">{{toFinish}}</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"time":{"editor":"text","default":"0:34.2"},"progress":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.06},"toFinishM":{"editor":"int","default":598800},"level":{"editor":"text","default":"ЛЮБИМЕЦ БУКМЕКЕРОВ"},"showLevel":{"editor":"boolean","default":true},"$preview":{"width":360,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const pr = Math.max(0, Math.min(1, P.progress ?? 0.06));
    const m = P.toFinishM ?? 598800;
    const cuts = [[0.16, 0.39], [0.47, 0.55], [0.6, 0.71]];
    let cm = '';
    cuts.forEach(c => { cm += 'M' + (16 + c[0] * 328).toFixed(1) + ' 67 H' + (16 + c[1] * 328).toFixed(1) + ' '; });
    return {
      time: P.time ?? '0:34.2',
      fillW: Math.max(6, pr * 328).toFixed(1),
      cutMarks: cm,
      level: P.level ?? 'ЛЮБИМЕЦ БУКМЕКЕРОВ',
      levelOpacity: (P.showLevel ?? true) ? 1 : 0,
      toFinish: m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' км' : Math.round(m) + ' м'
    };
  }
}
</script>
</body>
</html>
