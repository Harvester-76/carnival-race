<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Позиция и соперники</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative; width:460px; height:96px; font-family:'Golos Text',sans-serif; color:#F7E6BF">
  <!-- позиция -->
  <div style="position:absolute; left:0; top:0; width:128px; height:96px; box-sizing:border-box; border-radius:10px; background:rgba(6,10,24,0.72); box-shadow:inset 0 0 0 {{posEdgeW}}px {{posEdge}}; padding:12px">
    <div style="font-weight:700; font-size:11px; line-height:13px; letter-spacing:0.06em; color:#93A9D9">ПОЗИЦИЯ</div>
    <div style="margin-top:10px; display:flex; align-items:baseline; gap:2px; white-space:nowrap">
      <span style="font-family:'Dela Gothic One',sans-serif; font-size:40px; line-height:44px; color:{{posColor}}">{{pos}}</span>
      <span style="font-weight:700; font-size:18px; line-height:20px; color:#93A9D9">/{{total}}</span>
    </div>
  </div>

  <!-- соперники рядом -->
  <sc-if value="{{showRivals}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; left:140px; top:0; width:320px; height:96px; box-sizing:border-box; border-radius:10px; background:rgba(6,10,24,0.72); box-shadow:inset 0 0 0 1px rgba(147,169,217,0.28); padding:8px 12px; display:flex; flex-direction:column; gap:4px">
      <div style="height:36px; border-radius:6px; padding:0 6px; margin:0 -6px; background:{{a.bg}}; display:flex; align-items:center; gap:8px">
        <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M6 0 L12 10 H0 Z" fill="{{a.tri}}"></path></svg>
        <span style="flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; font-size:16px; color:{{a.nameColor}}">{{a.name}}</span>
        <span style="width:64px; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#FF8A1E">{{a.dist}}</span>
        <span style="width:56px; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#FF8A1E">{{a.time}}</span>
      </div>
      <div style="height:36px; border-radius:6px; padding:0 6px; margin:0 -6px; background:{{b.bg}}; display:flex; align-items:center; gap:8px">
        <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M0 0 H12 L6 10 Z" fill="{{b.tri}}"></path></svg>
        <span style="flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; font-size:16px; color:{{b.nameColor}}">{{b.name}}</span>
        <span style="width:64px; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#8CD9F2">{{b.dist}}</span>
        <span style="width:56px; text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#8CD9F2">{{b.time}}</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pos":{"editor":"int","default":7},"total":{"editor":"int","default":12},"flash":{"editor":"enum","options":["none","gain","loss"],"default":"none"},"ahead":{"editor":null},"behind":{"editor":null},"$preview":{"width":460,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const pos = P.pos ?? 7, total = P.total ?? 12, flash = P.flash ?? 'none';
    const ahead = P.ahead === undefined ? { name: 'Вега', dist: 340, time: 1.1 } : P.ahead;
    const behind = P.behind === undefined ? { name: 'Галлюцинация', dist: 120, time: 0.4 } : P.behind;
    const fd = m => m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' км' : Math.round(m) + ' м';
    const ft = t => t.toFixed(1).replace('.', ',') + ' с';
    const row = (r, col, emptyText) => r ? {
      name: r.name, dist: fd(r.dist), time: ft(r.time), tri: col, nameColor: '#F7E6BF',
      bg: r.time < 0.5 ? (col === '#FF8A1E' ? 'rgba(255,138,30,0.16)' : 'rgba(140,217,242,0.16)') : 'transparent'
    } : { name: emptyText, dist: '', time: '', tri: 'rgba(147,169,217,0.45)', nameColor: '#93A9D9', bg: 'transparent' };
    return {
      pos, total,
      posColor: flash === 'gain' ? '#59E673' : (flash === 'loss' ? '#FF8A1E' : '#F7E6BF'),
      posEdge: flash === 'gain' ? '#59E673' : (flash === 'loss' ? '#FF8A1E' : 'rgba(147,169,217,0.28)'),
      posEdgeW: flash === 'none' ? 1 : 2,
      showRivals: !!(ahead || behind),
      a: row(ahead, '#FF8A1E', pos === 1 ? 'Вы лидируете' : 'дальше 6 км'),
      b: row(behind, '#8CD9F2', pos === total ? 'Вы последний' : 'дальше 6 км')
    };
  }
}
</script>
</body>
</html>
