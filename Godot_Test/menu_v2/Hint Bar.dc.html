<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100px;box-sizing:border-box;padding:0 120px;border-top:2px solid {{ line }};display:flex;align-items:center;gap:40px;font-family:'Golos Text',sans-serif">
  <div style="flex:1;min-width:0;font-size:26px;color:#E2C99A;line-height:1.3;text-wrap:pretty">{{ hint }}</div>
  <div style="display:flex;align-items:center;gap:28px;font-size:24px;font-weight:600;color:#D9B27C">
    <sc-for list="{{ btns }}" as="b" hint-placeholder-count="2">
      <div style="display:flex;align-items:center;gap:10px">
        <sc-if value="{{ b.pad }}" hint-placeholder-val="{{ false }}"><span style="min-width:44px;height:40px;padding:0 8px;box-sizing:border-box;border:2px solid #D9B27C;border-radius:8px;display:grid;place-items:center;font-size:18px;color:#F7E6BF">{{ b.g }}</span></sc-if>
        <sc-if value="{{ b.key }}" hint-placeholder-val="{{ false }}"><span style="min-width:44px;height:40px;padding:0 10px;box-sizing:border-box;border:2px solid #D9B27C;border-bottom-width:4px;border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:18px;color:#F7E6BF">{{ b.g }}</span></sc-if>
        <sc-if value="{{ b.a }}" hint-placeholder-val="{{ false }}"><span style="width:40px;height:40px;border-radius:50%;background:#F7E6BF;color:#1A0D06;display:grid;place-items:center;font-size:22px;font-weight:900">A</span></sc-if>
        <sc-if value="{{ b.b }}" hint-placeholder-val="{{ false }}"><span style="width:40px;height:40px;border-radius:50%;box-sizing:border-box;border:3px solid #F7E6BF;color:#F7E6BF;display:grid;place-items:center;font-size:22px;font-weight:900">B</span></sc-if>
        <span>{{ b.l }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:100},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2A1E15&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;btns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;}}"></script>
</body>
</html>
